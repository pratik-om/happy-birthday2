<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background -->
<div class="background"></div>

<!-- Floating Balloons -->
<div class="balloons">
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
</div>

<!-- Main Content -->
<div class="container">

    <h1 class="title">
        🎂 Happy Birthday 🎂
    </h1>

    <p class="instruction">
        Swipe across the cake to cut it!
    </p>

    <!-- Cake -->
    <div id="cake">

        <div class="cake-left">
            <div class="icing"></div>
            <div class="layer"></div>
            <div class="candles">
                🕯️ 🕯️ 🕯️
            </div>
        </div>

        <div class="cake-right">
            <div class="icing"></div>
            <div class="layer"></div>
        </div>

    </div>

    <!-- Happy Birthday Message -->
    <div id="message">
        <h2>🎉 HAPPY BIRTHDAY! 🎉</h2>
        <p>Wishing you happiness, success and lots of cake! ❤️</p>
    </div>

</div>

<!-- Confetti -->
<div id="confetti"></div>

<!-- Party Poppers -->
<div id="party">
    🎉 🎊 🎉 🎊 🎉 🎊 🎉
</div>

<script src="script.js"></script>

</body>
</html>
