
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Background -->
<div class="background">
<div class="stars"></div>
<div class="lights"></div>
<div class="sparkles"></div>
</div>

<!-- Balloons -->
<div class="balloons">
<span style="--i:1"></span>
<span style="--i:2"></span>
<span style="--i:3"></span>
<span style="--i:4"></span>
<span style="--i:5"></span>
<span style="--i:6"></span>
<span style="--i:7"></span>
<span style="--i:8"></span>
<span style="--i:9"></span>
<span style="--i:10"></span>
</div>

<!-- Main Card -->
<div class="container">

<h3 class="subtitle">
🎉 Swipe the cake to cut it 🎉
</h3>

<h1 class="title">
Happy Birthday
</h1>

<!-- Cake -->
<div id="cake">

<div class="cake-left">

<div class="layer top"></div>
<div class="layer middle"></div>
<div class="layer bottom"></div>

<div class="icing"></div>

<div class="candles">

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

</div>

</div>

<div class="cake-right">

<div class="layer top"></div>
<div class="layer middle"></div>
<div class="layer bottom"></div>

<div class="icing"></div>

<div class="candles">

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

</div>

</div>

<!-- Knife -->
<div id="knife"></div>

<!-- Swipe Line -->
<div id="swipeLine"></div>

</div>

<!-- Hidden Message -->
<div id="message">

<h1>
🎉 HAPPY BIRTHDAY 🎉
</h1>

<p>
May all your dreams come true ❤️
</p>

<button id="replay">
Replay
</button>

</div>

</div>

<!-- Confetti -->
<canvas id="confetti"></canvas>

<!-- Fireworks -->
<canvas id="fireworks"></canvas>

<!-- Music -->
<audio id="music" loop>
<source src="music/happy-birthday.mp3" type="audio/mp3">
</audio>

<script src="script.js"></script>

</body>
</html>
